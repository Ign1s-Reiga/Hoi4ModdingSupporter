[package]
name = "hoi4-modding-supporter"
version = "0.3.0"
description = "Support tool for Hearts of Iron IV modding"
authors = ["Ign1s-Reiga"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hoi4_modding_supporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
  "tga",
] }

# DDS is read through this rather than `image`, which decodes only the DXT
# variants: the game writes its interface art uncompressed, with the old style
# masked header, and mods ship every block compression up to BC7.
#
# Decoding only. The default features add `encode`, which pulls `intel_tex_2`
# and with it a C++ toolchain, to write textures this tool never writes; they
# also add `strum`, for naming formats nothing here names. `ddsfile` and
# `image` are its own dependencies, re-exported, so neither is declared twice.
image_dds = { version = "0.7", default-features = false, features = [
  "ddsfile",
  "image",
] }

# The MCP server. Only the server side and the streamable HTTP transport;
# the client transports, OAuth and the rest stay out of the build.
rmcp = { version = "3", default-features = false, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
] }
# Derives the JSON schema each tool advertises for its input. rmcp uses it
# under the hood; it is declared here because the derive macro is ours.
schemars = "1"
# Hosts the MCP tower service on loopback. Tauri already runs a tokio
# runtime; these add the listener and the HTTP layer on top of it.
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = "0.7"
# Bearer tokens for the server, minted once and kept in settings.
uuid = { version = "1", features = ["v4"] }

# Decoding a forty megabyte bitmap and painting thirteen million pixels is
# unusable in an unoptimised build, so development optimises the dependencies
# doing that work and lightly optimises this crate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
